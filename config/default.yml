trading:
  mode: paper

ib:
  host: "127.0.0.1"
  client_id: 1
  timeout: 30.0
  max_reconnect_attempts: 0
  reconnect_delay: 5.0
  reconnect_max_delay: 120.0

database:
  url: "postgresql+asyncpg://trading:trading@localhost:5432/trading"
  pool_size: 10
  pool_overflow: 5

redis:
  url: "redis://localhost:6379/0"
  contract_cache_ttl: 3600

logging:
  level: "INFO"
  format: "console"

market_data:
  watchlist:
    - SPY
    - QQQ
    - IWM
    - AAPL
    - MSFT
  max_subscription_lines: 100
  reserved_lines: 20
  staleness_threshold_seconds: 30
  batch_flush_interval_seconds: 5.0
  batch_size: 500
  iv_refresh_interval_minutes: 15
  earnings_lookout_days: 7
  finnhub_api_key: !ENV ${FINNHUB_API_KEY}

agents:
  model: "anthropic:claude-sonnet-4-6"
  temperature: 0.1
  max_tokens: 2000
  request_limit: 10
  response_tokens_limit: 4000
  checkpoint_conn_string: "postgresql://trading:trading@localhost:5432/trading"

dashboard:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
  ws_ping_interval: 30
  update_throttle_ms: 500
  publisher_interval: 5

alerts:
  slack_enabled: false
  slack_webhook_url: !ENV ${SLACK_WEBHOOK_URL}
  slack_bot_token: !ENV ${SLACK_BOT_TOKEN}
  slack_app_token: !ENV ${SLACK_APP_TOKEN}
  slack_channel: "#trading-alerts"
  sms_enabled: false
  twilio_account_sid: !ENV ${TWILIO_ACCOUNT_SID}
  twilio_auth_token: !ENV ${TWILIO_AUTH_TOKEN}
  twilio_from_number: !ENV ${TWILIO_FROM_NUMBER}
  twilio_to_number: !ENV ${TWILIO_TO_NUMBER}
  sms_channels:
    - "alerts:risk_breach"
    - "alerts:circuit_breaker"
    - "alerts:system_error"
  sms_cooldown_seconds: 300

auto_execute:
  paper:
    max_loss_dollars: 2000.0
    max_delta_impact: 200.0
    max_vega_impact: 400.0
    approval_timeout_seconds: 300
  live:
    max_loss_dollars: 500.0
    max_delta_impact: 50.0
    max_vega_impact: 100.0
    approval_timeout_seconds: 300

risk_limits:
  paper:
    position:
      max_position_pct: 0.10
      max_contracts: 20
      max_dollars: 10000.0
    greeks:
      max_delta: 1000.0
      max_gamma: 200.0
      max_theta: -1000.0
      max_vega: 2000.0
    loss:
      daily_max_loss: 2000.0
      weekly_max_loss: 5000.0
    strategy:
      allowed_strategies:
        - covered_call
        - cash_secured_put
        - vertical_spread
        - iron_condor
        - iron_butterfly
        - calendar_spread
      allow_naked_options: false
    margin_check_timeout: 5.0
    emergency_halt: false
  live:
    position:
      max_position_pct: 0.05
      max_contracts: 10
      max_dollars: 5000.0
    greeks:
      max_delta: 500.0
      max_gamma: 100.0
      max_theta: -500.0
      max_vega: 1000.0
    loss:
      daily_max_loss: 1000.0
      weekly_max_loss: 3000.0
    strategy:
      allowed_strategies:
        - covered_call
        - cash_secured_put
        - vertical_spread
        - iron_condor
        - iron_butterfly
        - calendar_spread
      allow_naked_options: false
    margin_check_timeout: 5.0
    emergency_halt: false
