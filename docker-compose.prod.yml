# Production compose — extends base infrastructure with application services.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The base docker-compose.yml provides: ib-gateway, timescaledb, redis.
# This file adds: db-migrate, trading, dashboard-api, dashboard-ui.

services:
  # ── Override IB Gateway to accept connections from Docker network ──
  ib-gateway:
    volumes:
      - ./ibc-config.ini:/home/ibgateway/ibc/config.ini.tmpl

  # ── Run Alembic migrations before anything starts ──────────────
  db-migrate:
    build: .
    command: alembic upgrade head
    environment:
      TRADING__DATABASE__URL: postgresql+asyncpg://trading:${POSTGRES_PASSWORD:-trading}@timescaledb:5432/trading
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  # ── Trading engine (IB connection, agents, risk, orders) ───────
  trading:
    build: .
    command: python -m trading
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      TRADING__IB__HOST: ib-gateway
      TRADING__IB__PORT: "4004"
      TRADING__DATABASE__URL: postgresql+asyncpg://trading:${POSTGRES_PASSWORD:-trading}@timescaledb:5432/trading
      TRADING__REDIS__URL: redis://redis:6379/0
      TRADING__AGENTS__CHECKPOINT_CONN_STRING: postgresql://trading:${POSTGRES_PASSWORD:-trading}@timescaledb:5432/trading
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_TO_NUMBER: ${TWILIO_TO_NUMBER:-}
      TRADING__LOGGING__FORMAT: json
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      ib-gateway:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Dashboard API (FastAPI + WebSocket) ────────────────────────
  # Not exposed externally; Caddy proxies /api/* and /ws to it.
  dashboard-api:
    build: .
    command: >-
      uvicorn trading.dashboard.server:create_app
      --factory --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      TRADING__DATABASE__URL: postgresql+asyncpg://trading:${POSTGRES_PASSWORD:-trading}@timescaledb:5432/trading
      TRADING__REDIS__URL: redis://redis:6379/0
      TRADING__DASHBOARD__CORS_ORIGINS: '["https://${PUBLIC_HOST:-trading.moboabayomi.com}"]'
      TRADING__LOGGING__FORMAT: json
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Dashboard UI (Next.js) ─────────────────────────────────────
  # Not exposed externally; Caddy proxies / to it.
  # Build args left empty so the SPA uses origin-relative URLs.
  dashboard-ui:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    expose:
      - "3000"
    depends_on:
      - dashboard-api
    restart: unless-stopped

  # ── Caddy reverse proxy + automatic HTTPS ──────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-trading.moboabayomi.com}
    depends_on:
      - dashboard-ui
      - dashboard-api
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
