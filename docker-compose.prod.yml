# Production compose — extends base infrastructure with application services.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The base docker-compose.yml provides: ib-gateway, timescaledb, redis.
# This file adds: db-migrate, trading, dashboard-api, dashboard-ui.

services:
  # ── Run Alembic migrations before anything starts ──────────────
  db-migrate:
    build: .
    command: alembic upgrade head
    environment:
      TRADING__DATABASE__URL: postgresql+asyncpg://trading:${POSTGRES_PASSWORD:-trading}@timescaledb:5432/trading
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  # ── Trading engine (IB connection, agents, risk, orders) ───────
  trading:
    build: .
    command: python -m trading
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      TRADING__IB__HOST: ib-gateway
      TRADING__DATABASE__URL: postgresql+asyncpg://trading:${POSTGRES_PASSWORD:-trading}@timescaledb:5432/trading
      TRADING__REDIS__URL: redis://redis:6379/0
      TRADING__AGENTS__CHECKPOINT_CONN_STRING: postgresql://trading:${POSTGRES_PASSWORD:-trading}@timescaledb:5432/trading
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_TO_NUMBER: ${TWILIO_TO_NUMBER:-}
      TRADING__LOGGING__FORMAT: json
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      ib-gateway:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Dashboard API (FastAPI + WebSocket) ────────────────────────
  dashboard-api:
    build: .
    command: >-
      uvicorn trading.dashboard.server:create_app
      --factory --host 0.0.0.0 --port 8000
    ports:
      - "${DASHBOARD_API_PORT:-8000}:8000"
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      TRADING__DATABASE__URL: postgresql+asyncpg://trading:${POSTGRES_PASSWORD:-trading}@timescaledb:5432/trading
      TRADING__REDIS__URL: redis://redis:6379/0
      TRADING__DASHBOARD__CORS_ORIGINS: '["http://localhost:3000","http://${VPS_HOST:-localhost}:3000","http://${VPS_HOST:-localhost}"]'
      TRADING__LOGGING__FORMAT: json
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Dashboard UI (Next.js) ─────────────────────────────────────
  dashboard-ui:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_URL: http://${VPS_HOST:-localhost}:${DASHBOARD_API_PORT:-8000}
        NEXT_PUBLIC_WS_URL: ws://${VPS_HOST:-localhost}:${DASHBOARD_API_PORT:-8000}/ws
    ports:
      - "${DASHBOARD_UI_PORT:-3000}:3000"
    depends_on:
      - dashboard-api
    restart: unless-stopped
